name: Build and Publish PostgreSQL 18 ZA

on:
  push:
    branches:
      - master
    tags:
      - "pg18-v*.*.*"
    paths:
      - ".github/workflows/docker-pg18-za.yml"
      - "Makefile"
      - "docker_pg18_za/**"
  pull_request:
    paths:
      - ".github/workflows/docker-pg18-za.yml"
      - "Makefile"
      - "docker_pg18_za/**"
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: postgresql18_za

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^pg18-v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/pg18-v') }}
            type=match,pattern=^pg18-(v[0-9]+\.[0-9]+\.[0-9]+)$,group=1
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ./docker_pg18_za
          file: ./docker_pg18_za/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
